
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOTO ALBUM</title>

    <link href="https://fonts.googleapis.com/css2?family=Single+Day&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Single Day', sans-serif;
            background-image: url("배경.gif");
            background-repeat: repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 30px;
        }

        .photo-page {
            max-width: 850px;
            margin: 30px auto;
            padding: 25px;
        }

        h2 {
            color: #9E2024;
            text-align: center;
            font-size: 30px;
        }

        .photo-notice {
            text-align: center;
            font-size: 30px;
            margin: 20px auto;
        }

        /* 사진첩 목록 */
        .album-list {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
        }

        .album {
            width: 180px;
            height: 150px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 70px;
            background: rgba(255,255,255,0.7);
        }

        .album:hover {
            transform: scale(1.05);
        }

        /* 사진첩 내용 */
        .album-content {
            display: none;
            margin-top: 30px;
            border-top: 2px dashed #86BAAE;
            padding-top: 20px;
        }

        .album-content h3 {
            color: #9E2024;
            font-size: 18px;
        }

        .upload {
            margin: 15px 0;
        }

        /* 사진 배열 */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        /* 사진 크기 */
        .photo-grid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: 2px solid #C2E2DD;
            border-radius: 10px;
        }

        .photo-item {
            text-align: center;
        }

        .photo-item button {
            margin-top: 5px;
            cursor: pointer;
            font-family: 'Single Day', sans-serif;
        }

        /* 돌아가기 */
        .back {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #9E2024;
            font-size: 22px;
        }

        @media (max-width: 600px) {
            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .photo-grid img {
                height: 150px;
            }
        }
    </style>
</head>

<body>

<div class="photo-page">

    <h2>비밀 사진첩</h2>

    <p class="photo-notice">
        올리고 새로고침하면 삭제되니까 맘껏 올리삼
    </p>

    <!-- 사진첩 목록 -->
    <div class="album-list">

        <div class="album" onclick="openAlbum('me')">
            📷
        </div>

        <div class="album" onclick="openAlbum('heart')">
            ❤️
        </div>

    </div>

    <!-- 카메라 사진첩 -->
    <div id="me" class="album-content">

        <h3>📷 </h3>

        <input type="file" accept="image/*" multiple
            onchange="addPhotos(event, 'me')">

        <div class="photo-grid" id="me-photos">

            <div class="photo-item">
                <img src="사진첩1.jpg" alt="나의 사진 1">
            </div>

            <div class="photo-item">
                <img src="사진첩2.jpg" alt="나의 사진 2">
            </div>

            <div class="photo-item">
                <img src="사진첩3.jpg" alt="나의 사진 3">
            </div>

        </div>
    </div>

    <!-- 하트 사진첩 -->
    <div id="heart" class="album-content">

        <h3>❤️ </h3>

        <input type="file" accept="image/*" multiple
            onchange="addPhotos(event, 'heart')">

        <div class="photo-grid" id="heart-photos">

            <div class="photo-item">
                <img src="사진첩4.jpg" alt="추억 사진 1">
            </div>

            <div class="photo-item">
                <img src="사진첩5.jpg" alt="추억 사진 2">
            </div>

            <div class="photo-item">
                <img src="사진첩6.jpg" alt="추억 사진 3">
            </div>

        </div>
    </div>

    <a href="main.html" class="back">
        ← 미니홈피로 돌아가기
    </a>

</div>

<script>

    // 사진첩 열기
    function openAlbum(id) {

        document.querySelectorAll('.album-content').forEach(album => {
            album.style.display = 'none';
        });

        document.getElementById(id).style.display = 'block';
    }

    // 사진 추가
    function addPhotos(event, album) {

        const files = Array.from(event.target.files);

        files.forEach(file => {

            if (!file.type.startsWith('image/')) return;

            const reader = new FileReader();

            reader.onload = function(e) {

                const img = document.createElement('img');
                img.src = e.target.result;

                const item = document.createElement('div');
                item.className = 'photo-item';

                const button = document.createElement('button');
                button.textContent = '삭제';

                button.onclick = function() {
                    item.remove();
                };

                item.appendChild(img);
                item.appendChild(button);

                document.getElementById(album + '-photos').appendChild(item);

            };

            reader.readAsDataURL(file);

        });

        event.target.value = '';
    }

</script>

</body>
</html>
