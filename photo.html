
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PHOTO ALBUM</title>

    <link href="https://fonts.googleapis.com/css2?family=Single+Day&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Single Day', sans-serif;
            background-image: url("배경.gif");
            background-repeat: repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 30px;
        }

        .photo-page {
            max-width: 850px;
            margin: 30px auto;
            padding: 25px;

        h2 {
            color: #9E2024;
            text-align: center;
            font-size: 30px;
        }

        .album-list {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
        }

        .album {
            width: 180px;
            height: 150px;
            background:
            border:
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 70px;
        }


        }

        .album-content {
            display: none;
            margin-top: 30px;
            border-top: 2px dashed #86BAAE;
            padding-top: 20px;
        }

        .album-content h3 {
            color: #9E2024;
            font-size: 25px;
        }

        .upload {
            margin: 15px 0;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .photo-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border: 2px solid #C2E2DD;
            border-radius: 5px;
        }

        .photo-item button {
            margin-top: 5px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #9E2024;
        }
        .photo-notice {
    text-align: center;
    font-size: 30px;
    margin: 20px auto;
}
    </style>
</head>

<body>

<div class="photo-page">

    <h2>비밀 사진첩</h2>
    <p class="photo-notice">
    올리고 새로고침하면 삭제되니까 맘껏 올리삼
</p>
    

  
<div class="album-list">
    <div class="album" onclick="openAlbum('me')">
        📷
    </div>

    <div class="album" onclick="openAlbum('heart')">
        ❤️
    </div>
</div>

<!-- 카메라 사진첩 -->
<div id="me" class="album-content">
    <h3>📷 나의 사진</h3>

    <div class="photo-grid">
        <img src="사진첩1.jpg" alt="나의 사진 1">
        <img src="사진첩2.jpg" alt="나의 사진 2">
        <img src="사진첩3.jpg" alt="나의 사진 3">
    </div>
</div>

<!-- 하트 사진첩 -->
<div id="heart" class="album-content">
    <h3>❤️ 추억 사진</h3>

    <div class="photo-grid">
        <img src="사진첩41.jpg" alt="추억 사진 1">
        <img src="사진첩5.jpg" alt="추억 사진 2">
        <img src="사진첩6.jpg" alt="추억 사진 3">
    </div>
</div

<a href="main.html" class="back">← 미니홈피로 돌아가기</a>


<script>
    function openAlbum(id) {
        document.querySelectorAll('.album-content').forEach(album => {
            album.style.display = 'none';
        });

        document.getElementById(id).style.display = 'block';
    }

    function addPhotos(event, album) {
        const files = Array.from(event.target.files);

        files.forEach(file => {
            if (!file.type.startsWith('image/')) return;

            const reader = new FileReader();

            reader.onload = function(e) {
                const img = document.createElement('img');
                img.src = e.target.result;

                const item = document.createElement('div');
                item.className = 'photo-item';

                const button = document.createElement('button');
                button.textContent = '삭제';

                button.onclick = function() {
                    item.remove();
                };

                item.appendChild(img);
                item.appendChild(button);

                document.getElementById(album + '-photos').appendChild(item);
            };

            reader.readAsDataURL(file);
        });

        event.target.value = '';
    }
</script>

</body>
</html>
