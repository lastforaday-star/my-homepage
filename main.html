<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>안소영님의 미니홈피</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Single+Day&display=swap" rel="stylesheet">
    <style>
        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Single Day', sans-serif;
            background-image: url("배경.gif");
            background-repeat: repeat;
            background-position: center;
            background-attachment: fixed;
        }
        .homepage {
            width: 1000px;
            min-height: 600px;
            margin: 50px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 210px 1fr 130px;
            gap: 15px;
            background: #C2E2DD;
            border: 5px solid white;
            border-radius: 25px;
        }
        .profile {
            background: white;
            border: 2px solid #86BAAE;
            border-radius: 10px;
            padding: 15px;
        }
        .profile h3 {
            font-size: 17px;
            text-align: center;
            color: #B41C28;
        }
        .profile-image {
            width: 130px;
            height: 130px;
            margin: 15px auto;
            background: #C2E2DD;
            border: 2px dashed #86BAAE;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }
        .profile p {
            font-size: 18px;
            line-height: 1.6;
            text-align: center;
        }
        .content {
            background: white;
            border: 2px solid #86BAAE;
            border-radius: 10px;
            padding: 15px;
        }
        .content h2 {
            color: #B41C28;
            font-size: 17px;
            border-bottom: 1px solid #86BAAE;
            padding-bottom: 10px;
        }
        .news {
            background: #C2E2DD;
            border: 1px solid #86BAAE;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 17px;
            line-height: 2;
        }
        .miniroom {
            height: 280px;
            background: #ffffff;
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
        }
        .miniroom img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .menu a {
            display: block;
            padding: 12px 5px;
            text-align: center;
            text-decoration: none;
            color: white;
            background: #86BAAE;
            border: 1px solid #B41C28;
            border-radius: 8px;
            font-size: 19px;
        }
        .menu a:hover {
            background: #9CA123;
        }
        .menu .youtube {
            background: #B41C28;
        }
        .menu .back {
            background: #9E2024;
        }
        .footer {
            text-align: center;
            font-size: 11px;
            color: #9E2024;
            margin-top: 15px;
        }
        .creator {
            width: 900px;
            min-height: 230px;
            margin: -30px auto 50px;
            padding: 20px;
            border: 5px solid white;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-size: 25px;
            color: #B41C28;
        }
        .creator img {
            width: 800px;
            height: 700px;
            object-fit: cover;
            border-radius: 15px;
        }

        /* 운세 위젯 스타일 */
        .fortune-box {
            margin-top: 15px;
            padding: 10px;
            background-color: #f4f9f6;
            border: 2px dashed #b2d8c8;
            border-radius: 8px;
            text-align: center;
        }
        .fortune-title {
            font-size: 14px;
            font-weight: bold;
            color: #4a7c59;
            margin-bottom: 6px;
        }
        #fortune-text {
            font-size: 11px;
            color: #333;
            margin-bottom: 8px;
            line-height: 1.3;
            min-height: 30px;
        }
        .fortune-box button {
            background-color: #76a08e;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Single Day', sans-serif;
        }
        .fortune-box button:hover {
            background-color: #5c8372;
        }
        .fortune-tip {
            font-size: 9px !important;
            color: #666;
            margin-top: 6px;
            line-height: 1.2;
        }

        /* 미니 오락실 메뉴 박스 */
        .arcade-box {
            margin-top: 15px;
            padding: 10px;
            background-color: #fcf4f6;
            border: 2px dashed #e8b4bc;
            border-radius: 8px;
            text-align: center;
        }
        .arcade-title {
            font-size: 14px;
            font-weight: bold;
            color: #b44a59;
            margin-bottom: 8px;
        }
        .arcade-btn-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .arcade-btn {
            background-color: #d97987;
            color: white;
            border: none;
            padding: 6px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            font-family: 'Single Day', sans-serif;
            transition: background 0.2s;
        }
        .arcade-btn:hover {
            background-color: #b44a59;
        }

        /* 팝업 모달창 공통 스타일 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 15px;
            border: 3px solid #b44a59;
            width: 340px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 12px;
            background: none;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            color: #999;
        }
        .modal-close:hover {
            color: #B41C28;
        }

        /* 카드 게임 내부 그리드 스타일 */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin: 15px 0;
            justify-content: center;
        }
        .card {
            width: 60px;
            height: 60px;
            background-color: #f8c8d0;
            border: 2px solid white;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .card.flipped img, .card.matched img {
            display: block;
        }
        .card.flipped, .card.matched {
            background-color: white;
        }
    </style>
</head>

        <!-- 왼쪽 프로필 -->

            <h3>MY PROFILE</h3>

                <img src="프로필사진.jpg" alt="프로필 사진">
            </div>
            <p>방명록 안쓰면 바보</p>
