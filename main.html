<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>안소영님의 미니홈피</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Single+Day&display=swap" rel="stylesheet">
    <style>
        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Single Day', sans-serif;
            background-image: url("배경.gif");
            background-repeat: repeat;
            background-position: center;
            background-attachment: fixed;
        }
        .homepage {
            width: 1000px;
            min-height: 600px;
            margin: 50px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 210px 1fr 130px;
            gap: 15px;
            background: #C2E2DD;
            border: 5px solid white;
            border-radius: 25px;
        }
        .profile {
            background: white;
            border: 2px solid #86BAAE;
            border-radius: 10px;
            padding: 15px;
        }
        .profile h3 {
            font-size: 17px;
            text-align: center;
            color: #B41C28;
        }
        .profile-image {
            width: 130px;
            height: 130px;
            margin: 15px auto;
            background: #C2E2DD;
            border: 2px dashed #86BAAE;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }
        .profile p {
            font-size: 18px;
            line-height: 1.6;
            text-align: center;
        }
        .content {
            background: white;
            border: 2px solid #86BAAE;
            border-radius: 10px;
            padding: 15px;
        }
        .content h2 {
            color: #B41C28;
            font-size: 17px;
            border-bottom: 1px solid #86BAAE;
            padding-bottom: 10px;
        }
        .news {
            background: #C2E2DD;
            border: 1px solid #86BAAE;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 17px;
            line-height: 2;
        }
        .miniroom {
            height: 280px;
            background: #ffffff;
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
        }
        .miniroom img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .menu a {
            display: block;
            padding: 12px 5px;
            text-align: center;
            text-decoration: none;
            color: white;
            background: #86BAAE;
            border: 1px solid #B41C28;
            border-radius: 8px;
            font-size: 19px;
        }
        .menu a:hover {
            background: #9CA123;
        }
        .menu .youtube {
            background: #B41C28;
        }
        .menu .back {
            background: #9E2024;
        }
        .footer {
            text-align: center;
            font-size: 11px;
            color: #9E2024;
            margin-top: 15px;
        }
        .creator {
            width: 900px;
            min-height: 230px;
            margin: -30px auto 50px;
            padding: 20px;
            border: 5px solid white;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-size: 25px;
            color: #B41C28;
        }
        .creator img {
            width: 800px;
            height: 700px;
            object-fit: cover;
            border-radius: 15px;
        }

        /* 운세 위젯 스타일 */
        .fortune-box {
            margin-top: 15px;
            padding: 10px;
            background-color: #f4f9f6;
            border: 2px dashed #b2d8c8;
            border-radius: 8px;
            text-align: center;
        }
        .fortune-title {
            font-size: 14px;
            font-weight: bold;
            color: #4a7c59;
            margin-bottom: 6px;
        }
        #fortune-text {
            font-size: 11px;
            color: #333;
            margin-bottom: 8px;
            line-height: 1.3;
            min-height: 30px;
        }
        .fortune-box button {
            background-color: #76a08e;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Single Day', sans-serif;
        }
        .fortune-box button:hover {
            background-color: #5c8372;
        }
        .fortune-tip {
            font-size: 9px !important;
            color: #666;
            margin-top: 6px;
            line-height: 1.2;
        }

        /* 미니 오락실 메뉴 박스 */
        .arcade-box {
            margin-top: 15px;
            padding: 10px;
            background-color: #fcf4f6;
            border: 2px dashed #e8b4bc;
            border-radius: 8px;
            text-align: center;
        }
        .arcade-title {
            font-size: 14px;
            font-weight: bold;
            color: #b44a59;
            margin-bottom: 8px;
        }
        .arcade-btn-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .arcade-btn {
            background-color: #d97987;
            color: white;
            border: none;
            padding: 6px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            font-family: 'Single Day', sans-serif;
            transition: background 0.2s;
        }
        .arcade-btn:hover {
            background-color: #b44a59;
        }

        /* 팝업 모달창 공통 스타일 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 15px;
            border: 3px solid #b44a59;
            width: 340px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 12px;
            background: none;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            color: #999;
        }
        .modal-close:hover {
            color: #B41C28;
        }

        /* 카드 게임 내부 그리드 스타일 */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin: 15px 0;
            justify-content: center;
        }
        .card {
            width: 60px;
            height: 60px;
            background-color: #f8c8d0;
            border: 2px solid white;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .card.flipped img, .card.matched img {
            display: block;
        }
        .card.flipped, .card.matched {
            background-color: white;
        }
    </style>
</head>
<body>
    <div class="homepage">
        <!-- 왼쪽 프로필 -->
        <aside class="profile">
            <h3>MY PROFILE</h3>
            <div class="profile-image">
                <img src="프로필사진.jpg" alt="프로필 사진">
            </div>
            <p>방명록 안쓰면 바보</p>
            
            <!-- 오늘의 운세 위젯 -->
            <div class="fortune-box">
                <div class="fortune-title">🔮 오늘의 랜덤 운세</div>
                <div id="fortune-text">버튼을 눌러 운세를 확인해보세요!</div>
                <button type="button" onclick="showFortune()">운세 뽑기</button>
                <p class="fortune-tip">누를 때마다 바뀌니까 자기가 맘에 드는 거 나왔으면 멈추세용ㅋㅋ</p>
            </div>

            <!-- 미니 오락실 게임 메뉴 버튼들 -->
            <div class="arcade-box">
                <div class="arcade-title">🕹️ 미니 오락실</div>
                <div class="arcade-btn-group">
                    <button class="arcade-btn" type="button" onclick="openModal('card-game-modal')">[카드 짝 맞추기 게임]</button>
                    <button class="arcade-btn" type="button" onclick="openModal('b-game-modal')">[B게임]</button>
                    <button class="arcade-btn" type="button" onclick="openModal('c-game-modal')">[C게임]</button>
                </div>
            </div>
        </aside>

        <!-- 가운데 메인 화면 -->
        <main class="content">
            <h2>공부하기 싫어서 만들었어요</h2>
            <div class="news">
                <strong>오늘은?</strong><br>
                · <span id="current-date"></span>
            </div>
            <div class="miniroom-title">Mini Room</div>
            <div class="miniroom">
                <img src="miniroom.gif" alt="미니룸">
            </div>
            <div class="footer">Copyright@ 어쩌구저쩌구</div>
        </main>

        <!-- 오른쪽 메뉴 -->
        <nav class="menu">
            <a href="index.html" class="back">처음으로</a>
            <a href="diary.html">다이어리</a>
            <a href="photo.html">사진첩</a>
            <a href="guestbook.html">방명록</a>
            <a href="#">게시판</a>
            <a href="https://www.youtube.com/@lastforaday" target="_blank" class="youtube">▶ YouTube</a>
        </nav>
    </div>

    <!-- 만든이 영역 -->
    <section class="creator">
        <span>만든이</span>
        <span>👉</span>
        <img src="만든이 사진.JPG" alt="만든이 사진">
    </section>

    <!-- 1. 카드 짝 맞추기 게임 팝업창 -->
    <div id="card-game-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" type="button" onclick="closeModal('card-game-modal')">&times;</button>
            <h3 style="color:#b44a59; margin-top:0;">🃏 카드 짝 맞추기</h3>
            <div id="game-grid" class="game-grid"></div>
            <button class="arcade-btn" type="button" onclick="startCardGame()">다시 섞기</button>
            <div id="game-status" style="font-size:12px; margin-top:8px; color:#555;">카드를 뒤집어 짝을 맞춰보세요!</div>
        </div>
    </div>

    <!-- 2. B게임 팝업창 -->
    <div id="b-game-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" type="button" onclick="closeModal('b-game-modal')">&times;</button>
            <h3 style="color:#b44a59; margin-top:0;">🎮 B게임</h3>
            <p style="font-size:14px; color:#444; margin: 20px 0;">여기에 두 번째 게임을 추가해 보세요!</p>
            <button class="arcade-btn" type="button" onclick="closeModal('b-game-modal')">닫기</button>
        </div>
    </div>

    <!-- 3. C게임 팝업창 -->
    <div id="c-game-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" type="button" onclick="closeModal('c-game-modal')">&times;</button>
            <h3 style="color:#b44a59; margin-top:0;">🎯 C게임</h3>
            <p style="font-size:14px; color:#444; margin: 20px 0;">여기에 세 번째 게임을 추가해 보세요!</p>
            <button class="arcade-btn" type="button" onclick="closeModal('c-game-modal')">닫기</button>
        </div>
    </div>

    <!-- 자바스크립트 영역 -->
    <script>
        // 날짜 출력 및 초기화
        document.addEventListener("DOMContentLoaded", function() {
            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth() + 1;
            const day = today.getDate();
            const dateElement = document.getElementById("current-date");
            if (dateElement) {
                dateElement.innerText = year + "년 " + month + "월 " + day + "일";
            }
        });

        // 운세 데이터
        const fortunes = [
            "오늘은 공부를 안 해도 죄책감이 들지 않는 마법의 날! 😆",
            "뜻밖의 장소에서 맛있는 간식을 발견하게 될 거예요.",
            "오늘 풀던 문제는 시험에 꼭 나옵니다! (아마도?)",
            "잠깐의 낮잠이 온 세상의 피로를 싹 씻어줄 거예요.",
            "오늘은 뭘 해도 귀여움을 받는 대길의 날입니다 ✨",
            "오늘 먹는 야식은 0kcal... 였으면 좋겠지만 살로 갑니다 🐷",
            "누가 지갑 주웠으면 좋겠다고 생각하는 바로 그 일이 일어납니다!",
            "침대에 누우면 1초 만에 기절하는 기적의 밤이 찾아와요 🛏️💤",
            "공부는 내일부터! 오늘은 일단 귀여우니까 합격 ✨",
            "거울을 보세요. 오늘 미모가 폭발해서 위험할 수 있습니다 💣",
            "모르는 번호로 오는 전화는 받지 마세요. 행운이 도망갑니다!",
            "오늘은 뭘 해도 다 잘 풀릴... 리가 없으니 마음을 비우세요 😌",
            "갑자기 치킨이 먹고 싶다면 그것은 운명의 계시입니다.",
            "누군가 맛있는 걸 사줄지도 몰라요. 지갑을 사수하세요!",
            "길 가다가 새똥 맞을 수도 있으니까 나가지 마세요잉",
            "로또 사자! 당첨되면 친구(안소영)에게 주면 두배가 될겨",
            "친구(안소영)에게 맛있는 걸 사주기 좋은 날이네요"
        ];

        function showFortune() {
            const randomIndex = Math.floor(Math.random() * fortunes.length);
            const fortuneText = document.getElementById("fortune-text");
            if (fortuneText) {
                fortuneText.innerText = fortunes[randomIndex];
            }
        }

        // 팝업 모달창 열기
        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.style.display = "flex";
                if (modalId === 'card-game-modal') {
                    startCardGame();
                }
            }
        }

        // 팝업 모달창 닫기
        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.style.display = "none";
            }
        }

        // 카드 짝 맞추기 게임 로직
        const cardImages = [
            "card1.jpg", "card2.jpg", "card3.jpg", "card4.jpg",
            "card5.jpg", "card6.jpg", "card7.jpg", "card8.jpg"
        ];

        let flippedCards = [];
        let matchedCount = 0;
        let isLockBoard = false;

        function startCardGame() {
            const grid = document.getElementById("game-grid");
            if (!grid) return;
            grid.innerHTML = "";
            flippedCards = [];
            matchedCount = 0;
            isLockBoard = false;
            
            const statusEl = document.getElementById("game-status");
            if (statusEl) {
                statusEl.innerText = "카드를 뒤집어 짝을 맞춰보세요!";
            }

            let deck = [...cardImages, ...cardImages];
            deck.sort(() => Math.random() - 0.5);

            deck.forEach((imgSrc) => {
                const card = document.createElement("div");
                card.classList.add("card");
                card.dataset.image = imgSrc;

                const img = document.createElement("img");
                img.src = imgSrc;
                img.alt = "카드 이미지";
                card.appendChild(img);

                card.addEventListener("click", flipCard);
                grid.appendChild(card);
            });
        }

        function flipCard() {
            if (isLockBoard) return;
            if (this === flippedCards[0]) return;
            if (this.classList.contains("matched") || this.classList.contains("flipped")) return;

            this.classList.add("flipped");
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                checkForMatch();
            }
        }

        function checkForMatch() {
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.image === card2.dataset.image;

            if (isMatch) {
                card1.classList.add("matched");
                card2.classList.add("matched");
                matchedCount += 2;
                flippedCards = [];

                if (matchedCount === 16) {
                    const statusEl = document.getElementById("game-status");
                    if (statusEl) {
                        statusEl.innerText = "🎉 축하합니다! 다 맞췄어요! ✨";
                    }
                }
            } else {
                isLockBoard = true;
                setTimeout(() => {
                    card1.classList.remove("flipped");
                    card2.classList.remove("flipped");
                    flippedCards = [];
                    isLockBoard = false;
                }, 800);
            }
        }
    </script>
</body>
</html>
