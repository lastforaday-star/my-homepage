
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>맛집 갤러리</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f5f6f8;
      color: #222;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      padding: 24px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      color: #333;
      text-decoration: none;
    }

    .home-link {
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .intro {
      margin-bottom: 25px;
    }

    .intro h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .intro p {
      margin: 0;
      color: #888;
      font-size: 14px;
    }

    .board {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      overflow: hidden;
    }

    .board iframe {
      display: block;
      width: 100%;
      min-height: 1100px;
      border: 0;
      background: white;
    }

    footer {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      padding: 30px 10px;
    }

    @media (max-width: 600px) {
      .header-inner { padding: 20px 15px; }
      .container { margin-top: 25px; padding: 0 10px; }
      .intro h1 { font-size: 23px; }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <a class="logo" href="freeboard.html">맛집 갤러리</a>
    <a class="home-link" href="main.html">← 미니홈피로 돌아가기</a>
  </div>
</header>

<main class="container">
  <div class="intro">
    <h1>맛집 커뮤니티</h1>
    <p>맛있는 곳을 기록하고, 함께 공유하는 공간</p>
  </div>

  <section class="board">
    <iframe
      src="https://script.google.com/macros/s/AKfycbxWM1_7i3RUJ-mRSa59TxoxWXmqC48x53qme1SGfZ7peyIUHi15o-O_dqJ-phmH0FS4sA/exec"
      title="맛집 갤러리 게시판">
    </iframe>
  </section>
</main>

<footer>
  맛집 갤러리
</footer>

</body>
</html>
