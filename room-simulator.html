<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>미니룸 꾸미기 시뮬레이터 (코드 구현형)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Single+Day&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Single Day', sans-serif;
            background-color: #fff0f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .simulator-container {
            width: 720px;
            background: white;
            border: 4px solid #b44a59;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2 {
            color: #b44a59;
            margin-top: 0;
            margin-bottom: 10px;
        }

        #guide-text {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
        }

        /* 미니룸 배경 화면 (순수 CSS와 그라데이션으로 싸이월드 감성 룸 구현) */
        .room-viewport {
            position: relative;
            width: 660px;
            height: 340px;
            margin: 0 auto 20px auto;
            border: 3px solid #86BAAE;
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(135deg, #f4f9f6 0%, #e2f0eb 100%);
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.05);
        }

        /* 방의 바닥과 벽 느낌을 주는 격자 무늬 배경 선 */
        .room-viewport::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(#b2d8c8 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.4;
        }

        /* 미니룸에 배치된 가구 아이템 스타일 */
        .placed-item {
            position: absolute;
            cursor: pointer;
            transform: translate(-50%, -50%);
            font-size: 38px;
            padding: 5px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            border: 1px dashed #b44a59;
            user-select: none;
            transition: transform 0.1s;
            filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.15));
        }
        .placed-item:hover {
            transform: translate(-50%, -50%) scale(1.15);
            background: rgba(255, 255, 255, 0.95);
        }

        /* 가구 선택 팔레트 (코드 내부 이모지/심볼로 가구 10개 구성) */
        .furniture-palette {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            background: #fcf4f6;
            padding: 15px;
            border-radius: 12px;
            border: 2px dashed #e8b4bc;
            margin-bottom: 15px;
        }

        .furniture-card {
            background: white;
            border: 2px solid #e8b4bc;
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .furniture-card:hover {
            background: #f8c8d0;
            transform: translateY(-3px);
        }
        .furniture-icon {
            font-size: 28px;
            margin-bottom: 4px;
            display: block;
        }
        .furniture-name {
            font-size: 11px;
            color: #333;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .action-btn {
            background-color: #d97987;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Single Day', sans-serif;
            transition: background 0.2s;
        }
        .action-btn:hover {
            background-color: #b44a59;
        }
        .back-btn {
            background-color: #86BAAE;
        }
        .back-btn:hover {
            background-color: #5c8372;
        }
    </style>
</head>
<body>

    <div class="simulator-container">
        <h2>✨ 나만의 미니룸 꾸미기 시뮬레이터 ✨</h2>
        <div id="guide-text">아래 가구를 클릭하여 선택한 뒤 미니룸 안을 클릭해 배치하세요! (배치된 가구를 클릭하면 삭제돼요)</div>

        <!-- 미니룸 배경 화면 (코드 단독 구현) -->
        <div id="room-viewport" class="room-viewport" onclick="placeFurniture(event)"></div>

        <!-- 가구 선택 팔레트 (10가지 도트 감성 가구 아이템) -->
        <div class="furniture-palette">
            <div class="furniture-card" onclick="selectFurniture('☕', '체크 식탁세트')">
                <span class="furniture-icon">☕</span>
                <div class="furniture-name">식탁세트</div>
            </div>
            <div class="furniture-card" onclick="selectFurniture('🛋️', '핑크 소파')">
                <span class="furniture-icon">🛋️</span>
                <div class="furniture-name">핑크소파</div>
            </div>
            <div class="furniture-card" onclick="selectFurniture('🛏️', '체크 침대')">
                <span class="furniture-icon">🛏️</span>
                <div class="furniture-name">모던침대</div>
            </div>
            <div class="furniture-card" onclick="selectFurniture('💻', '노트북 책상')">
                <span class="furniture-icon">💻</span>
                <div class="furniture-name">책상세트</div>
            </div>
            <div class="furniture-card" onclick="selectFurniture('🪴', '초록이 화분')">
                <span class="furniture-icon">🪴</span>
                <div class="furniture-name">실내화분</div>
            </div>
            <div class="furniture-card" onclick="selectFurniture('🪞', '공주 화장대')">
                <span class="furniture-icon">🪞</span>
                <div class="furniture-name">화장대</div>
            </div>
            <div class="furniture-card" onclick="selectFurniture('🧸', '왕곰돌이 인형')">
                <span class="furniture-icon">🧸</span>
                <div class="furniture-name">곰인형</div>
            </div>
            <div class="furniture-card" onclick="selectFurniture('📚', '책장 수납장')">
                <span class="furniture-icon">📚</span>
                <div class="furniture-name">책장</div>
            </div>
            <div class="furniture-card" onclick="selectFurniture('💡', '스탠드 조명')">
                <span class="furniture-icon">💡</span>
                <div class="furniture-name">조명</div>
            </div>
            <div class="furniture-card" onclick="selectFurniture('📻', '레트로 라디오')">
                <span class="furniture-icon">📻</span>
                <div class="furniture-name">라디오</div>
            </div>
        </div>

        <div class="controls">
            <button class="action-btn" onclick="clearRoom()">전체 초기화</button>
            <button class="action-btn back-btn" onclick="location.href='main.html'">미니홈피로 돌아가기</button>
        </div>
    </div>

    <script>
        let selectedSymbol = null;

        function selectFurniture(symbol, name) {
            selectedSymbol = symbol;
            document.getElementById("guide-text").innerText = `선택된 가구: [${name}] 👉 미니룸 안을 클릭하여 배치하세요!`;
        }

        function placeFurniture(event) {
            if (!selectedSymbol) {
                alert("먼저 아래 목록에서 배치할 가구를 선택해주세요!");
                return;
            }

            const viewport = document.getElementById("room-viewport");
            const rect = viewport.getBoundingClientRect();
            
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            const item = document.createElement("div");
            item.classList.add("placed-item");
            item.style.left = x + "px";
            item.style.top = y + "px";
            item.innerText = selectedSymbol;

            // 배치된 가구를 클릭하면 삭제
            item.addEventListener("click", function(e) {
                e.stopPropagation();
                item.remove();
            });

            viewport.appendChild(item);
        }

        function clearRoom() {
            const viewport = document.getElementById("room-viewport");
            viewport.innerHTML = "";
            selectedSymbol = null;
            document.getElementById("guide-text").innerText = "가구를 초기화했습니다. 가구를 다시 선택해주세요!";
        }
    </script>
</body>
</html>
