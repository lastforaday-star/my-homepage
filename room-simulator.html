
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Mini Room</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 30px 15px;
    background: #f7e9e7;
    font-family: 'Jua', sans-serif;
    color: #715b58;
}

.container {
    max-width: 950px;
    margin: auto;
    background: #fffaf5;
    padding: 25px;
    border: 5px solid #d9b5aa;
    border-radius: 15px;
    box-shadow: 5px 7px 0 #c9a39b;
}

header {
    text-align: center;
    margin-bottom: 20px;
}

header h1 {
    font-size: 29px;
    color: #b77f83;
    margin: 5px;
}

header p {
    font-size: 13px;
    color: #ad9290;
}

/* 미니룸 */

.room {
    position: relative;
    width: 100%;
    aspect-ratio: 760 / 430;
    overflow: hidden;
    border: 5px solid #d4b5a3;
    background: #f5e5d8;
    box-shadow: inset 0 0 10px #c7a998;
    touch-action: none;
}

/* 벽 */

.wall {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 69%;
    background-color: #f6e9dc;
    background-image:
        linear-gradient(#ead8c9 1px, transparent 1px),
        linear-gradient(90deg, #ead8c9 1px, transparent 1px);
    background-size: 45px 45px;
}

/* 바닥 */

.floor {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 31%;
    background-color: #d9b69a;
    background-image:
        linear-gradient(#c59e82 2px, transparent 2px),
        linear-gradient(90deg, #c59e82 1px, transparent 1px);
    background-size: 100% 28px, 95px 100%;
    border-top: 7px solid #c49e83;
}

/* 창문 */

.window {
    position: absolute;
    top: 7%;
    left: 36%;
    width: 28%;
    height: 39%;
    background: #c5e4e5;
    border: 9px solid #fffaf0;
    box-shadow: 0 0 0 3px #c8a58d;
}

.window::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    width: 5px;
    height: 100%;
    background: #fffaf0;
}

.window::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 5px;
    background: #fffaf0;
}

.curtain {
    position: absolute;
    top: -5px;
    width: 19%;
    height: 110%;
    background: repeating-linear-gradient(
        90deg, #e9aeb2 0 8px, #f5c9c9 8px 16px
    );
    z-index: 2;
}

.curtain.left { left: -12%; }
.curtain.right { right: -12%; }

/* 햇살 */

.sunlight {
    position: absolute;
    top: 46%;
    left: 34%;
    width: 33%;
    height: 20%;
    background: linear-gradient(
        110deg, transparent, rgba(255,238,190,.4), transparent
    );
    pointer-events: none;
}

/* 벽 장식 */

.wall-decoration {
    position: absolute;
    top: 17%;
    left: 9%;
    width: 12%;
    padding: 8px;
    text-align: center;
    background: #fffaf0;
    border: 5px solid #bd9580;
    font-size: clamp(8px, 1.4vw, 15px);
    color: #b67e82;
    transform: rotate(-4deg);
}

.wall-clock {
    position: absolute;
    top: 15%;
    right: 10%;
    width: 9%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #fff9ed;
    border: 5px solid #c89e84;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(10px, 2vw, 20px);
}

/* 러그 */

.rug {
    position: absolute;
    width: 40%;
    height: 23%;
    bottom: 3%;
    left: 30%;
    border-radius: 50%;
    background: #e9b7b1;
    border: 5px dashed #f8ddd2;
    box-shadow: inset 0 0 0 7px #dfaaa6;
    pointer-events: none;
}

/* 배치 가구 */

.placed-item {
    position: absolute;
    width: 17%;
    min-width: 40px;
    cursor: grab;
    transform: translate(-50%, -50%);
    transform-origin: center;
    touch-action: none;
    user-select: none;
    z-index: 5;
}

.placed-item svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
    shape-rendering: crispEdges;
    pointer-events: none;
}

.placed-item.selected {
    outline: 2px dashed #c77d88;
    outline-offset: 4px;
}

.placed-item:active {
    cursor: grabbing;
}

/* 가구 선택 */

.section-title {
    margin: 22px 0 10px;
    font-size: 18px;
    color: #a97677;
}

.palette {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 9px;
    padding: 13px;
    background: #f8eae5;
    border: 2px dashed #dbb5aa;
    border-radius: 10px;
}

.card {
    border: 2px solid #ecd2ca;
    border-radius: 9px;
    background: #fffdf9;
    padding: 7px 3px;
    text-align: center;
    cursor: pointer;
    transition: .15s;
}

.card:hover, .card.active {
    background: #f4d7d3;
    border-color: #c98d91;
    transform: translateY(-3px);
}

.card svg {
    width: 65px;
    height: 60px;
    shape-rendering: crispEdges;
}

.card span {
    display: block;
    font-size: 12px;
}

/* 조작 버튼 */

.editor {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 15px;
    padding: 12px;
    background: #fff1ed;
    border-radius: 10px;
}

.editor-label {
    font-size: 14px;
    margin-right: 5px;
}

button {
    font-family: 'Jua', sans-serif;
    border: 0;
    border-radius: 7px;
    padding: 9px 13px;
    background: #d99b9e;
    color: white;
    cursor: pointer;
    font-size: 13px;
}

button:hover {
    background: #bc777e;
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

button.secondary {
    background: #a9bdb0;
}

button.secondary:hover {
    background: #829e8d;
}

.guide {
    margin-top: 12px;
    text-align: center;
    font-size: 13px;
    color: #ae8984;
    min-height: 20px;
}

footer {
    text-align: center;
    font-size: 12px;
    color: #b99a91;
    margin-top: 18px;
}

@media(max-width: 600px) {
    .container { padding: 12px; }
    header h1 { font-size: 22px; }
    .palette { grid-template-columns: repeat(3, 1fr); }
    .editor { justify-content: center; }
    button { padding: 8px 10px; }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>♡ MY MINI ROOM ♡</h1>
    <p>Welcome to my little cozy room!</p>
</header>

<div class="room" id="room">

    <div class="wall"></div>
    <div class="floor"></div>

    <div class="window">
        <div class="curtain left"></div>
        <div class="curtain right"></div>
    </div>

    <div class="sunlight"></div>

    <div class="wall-decoration">MY<br>ROOM ♡</div>
    <div class="wall-clock">12</div>

    <div class="rug"></div>

</div>

<h3 class="section-title">♡ Furniture Shop</h3>

<div class="palette" id="palette"></div>

<div class="editor">
    <span class="editor-label">가구 편집 :</span>
    <button onclick="resizeItem(1.15)">크게 +</button>
    <button onclick="resizeItem(0.87)">작게 -</button>
    <button onclick="rotateItem()">회전 ↻</button>
    <button onclick="deleteItem()" class="secondary">선택 삭제</button>
    <button onclick="saveRoom()">저장 ♡</button>
    <button onclick="loadRoom()" class="secondary">불러오기</button>
    <button onclick="clearRoom()" class="secondary">초기화</button>
</div>

<div class="guide" id="guide">
    가구를 선택하고 방을 클릭해 배치하세요 ♡
</div>

<footer>
    MY LITTLE WORLD · 2000's PIXEL ROOM
</footer>

</div>

// 팔레트 만들기

const palette = document.getElementById('palette');

Object.entries(furniture).forEach(([id, item]) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = item.svg + `<span>${item.name}</span>`;
    card.onclick = () => selectFurniture(id, card);
    card.dataset.id = id;
    palette.appendChild(card);
});

const room = document.getElementById('room');
const guide = document.getElementById('guide');

let selectedFurniture = null;
let selectedItem = null;
let dragging = false;
let dragOffsetX = 0;
let dragOffsetY = 0;

// 가구 선택

function selectFurniture(id, card) {
    selectedFurniture = id;

    document.querySelectorAll('.card').forEach(c =>
        c.classList.remove('active')
    );

    card.classList.add('active');

    guide.textContent =
        furniture[id].name + ' 선택 완료! 방을 클릭해서 배치하세요 ♡';
}

// 방 클릭 시 배치

room.addEventListener('click', (e) => {

    if (e.target.closest('.placed-item')) return;
    if (!selectedFurniture) {
        guide.textContent = '먼저 가구를 선택해주세요!';
        return;
    }

    const rect = room.getBoundingClientRect();

    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;

    createItem(selectedFurniture, x, y);

});

// 가구 생성

function createItem(id, x, y, size = 17, rotation = 0) {

    const item = document.createElement('div');

    item.className = 'placed-item';
    item.dataset.id = id;
    item.dataset.size = size;
    item.dataset.rotation = rotation;

    item.style.left = x + '%';
    item.style.top = y + '%';
    item.style.width = size + '%';
    item.style.transform =
        `translate(-50%, -50%) rotate(${rotation}deg)`;

    item.innerHTML = furniture[id].svg;

    item.addEventListener('pointerdown', startDrag);

    item.addEventListener('click', e => {
        e.stopPropagation();
        selectPlacedItem(item);
    });

    room.appendChild(item);
    selectPlacedItem(item);

    return item;
}

// 가구 선택

function selectPlacedItem(item) {

    document.querySelectorAll('.placed-item').forEach(el =>
        el.classList.remove('selected')
    );

    selectedItem = item;
    item.classList.add('selected');

    guide.textContent =
        furniture[item.dataset.id].name +
        ' 선택됨 · 드래그해서 이동할 수 있어요!';
}

// 드래그 이동

function startDrag(e) {

    e.preventDefault();
    e.stopPropagation();

    const item = e.currentTarget;

    selectPlacedItem(item);

    dragging = true;

    const rect = room.getBoundingClientRect();
    const itemRect = item.getBoundingClientRect();

    dragOffsetX = e.clientX -
        (itemRect.left + itemRect.width / 2);

    dragOffsetY = e.clientY -
        (itemRect.top + itemRect.height / 2);

    item.setPointerCapture(e.pointerId);
}

document.addEventListener('pointermove', e => {

    if (!dragging || !selectedItem) return;

    const rect = room.getBoundingClientRect();

    const x = e.clientX - rect.left - dragOffsetX;
    const y = e.clientY - rect.top - dragOffsetY;

    const halfWidth = selectedItem.offsetWidth / 2;
    const halfHeight = selectedItem.offsetHeight / 2;

    const safeX = Math.max(halfWidth,
        Math.min(rect.width - halfWidth, x));

    const safeY = Math.max(halfHeight,
        Math.min(rect.height - halfHeight, y));

    selectedItem.style.left = (safeX / rect.width * 100) + '%';
    selectedItem.style.top = (safeY / rect.height * 100) + '%';

});

document.addEventListener('pointerup', () => {
    dragging = false;
});

// 크기 변경

function resizeItem(factor) {

    if (!selectedItem) {
        guide.textContent = '먼저 배치된 가구를 선택하세요!';
        return;
    }

    let size = Number(selectedItem.dataset.size);
    size = Math.max(6, Math.min(35, size * factor));

    selectedItem.dataset.size = size;
    selectedItem.style.width = size + '%';
}

// 회전

function rotateItem() {

    if (!selectedItem) {
        guide.textContent = '먼저 가구를 선택하세요!';
        return;
    }

    let rotation =
        Number(selectedItem.dataset.rotation) + 15;

    if (rotation >= 360) rotation = 0;

    selectedItem.dataset.rotation = rotation;

    selectedItem.style.transform =
        `translate(-50%, -50%) rotate(${rotation}deg)`;
}

// 삭제

function deleteItem() {

    if (!selectedItem) {
        guide.textContent = '삭제할 가구를 선택하세요!';
        return;
    }

    selectedItem.remove();
    selectedItem = null;

    guide.textContent = '가구를 삭제했어요 ♡';
}

// 초기화

function clearRoom() {

    if (!confirm('방을 모두 초기화할까요?')) return;

    room.querySelectorAll('.placed-item').forEach(item =>
        item.remove()
    );

    selectedItem = null;
    selectedFurniture = null;

    document.querySelectorAll('.card').forEach(c =>
        c.classList.remove('active')
    );

    guide.textContent = '새로운 미니룸을 꾸며보세요 ♡';
}

// 저장

function saveRoom() {

    const items = [...room.querySelectorAll('.placed-item')].map(item => ({
        id: item.dataset.id,
        x: item.style.left,
        y: item.style.top,
        size: item.dataset.size,
        rotation: item.dataset.rotation
    }));

    localStorage.setItem('myMiniRoom', JSON.stringify(items));

    guide.textContent = '미니룸이 저장되었어요! ♡';
}

// 불러오기

function loadRoom() {

    const saved = localStorage.getItem('myMiniRoom');

    if (!saved) {
        guide.textContent = '저장된 미니룸이 없어요!';
        return;
    }

    room.querySelectorAll('.placed-item').forEach(item =>
        item.remove()
    );

    JSON.parse(saved).forEach(data => {

        createItem(
            data.id,
            parseFloat(data.x),
            parseFloat(data.y),
            Number(data.size),
            Number(data.rotation)
        );

    });

    selectedItem = null;

    guide.textContent = '저장한 미니룸을 불러왔어요 ♡';
}

</script>

</body>
</html>
