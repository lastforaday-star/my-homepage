<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>안소영님의 미니홈피</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Single+Day&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Single Day', sans-serif;
            background-color: #fff0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 전체 검증 컨테이너 박스 */
        .verify-box {
            text-align: center;
            position: relative;
        }

        /* 캐릭터 영역 및 말풍선 */
        .character-wrapper {
            position: relative;
            display: inline-block;
        }

        .entry-image {
            width: 400px;
            max-width: 90vw;
            border-radius: 15px;
            border: 3px solid #ffb6c1;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        /* 말풍선 버튼 */
        .speech-bubble-btn {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            background: #B41C28;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Single Day', sans-serif;
            border: 2px solid white;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            animation: bounce 1.5s infinite;
            white-space: nowrap;
            z-index: 10;
        }

        .speech-bubble-btn::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 6px 0 6px;
            border-style: solid;
            border-color: #B41C28 transparent;
            display: block;
            width: 0;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }

        /* 퀴즈 모달 팝업 박스 */
        .quiz-modal {
            display: none; /* 처음에 숨김 */
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 380px;
            background: white;
            border: 4px solid #B41C28;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 100;
        }

        .quiz-question {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .ox-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .ox-btn {
            width: 65px;
            height: 65px;
            font-size: 26px;
            font-weight: bold;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-family: 'Single Day', sans-serif;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        .btn-o { background-color: #4a7c59; }
        .btn-o:hover { transform: scale(1.05); background-color: #3b6347; }

        .btn-x { background-color: #B41C28; }
        .btn-x:hover { transform: scale(1.05); background-color: #92141e; }

        #quiz-result {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 12px;
            min-height: 22px;
        }

        .skip-btn {
            background: transparent;
            border: none;
            color: #666;
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
            font-family: 'Single Day', sans-serif;
        }
        .skip-btn:hover {
            color: #B41C28;
        }
    </style>
</head>
<body>

    <div class="verify-box">
        <!-- 캐릭터 영역 및 말풍선 버튼 -->
        <div class="character-wrapper">
            <button class="speech-bubble-btn" onclick="openQuiz()">문제 풀고 들어오삼 👉</button>
            <img src="메인사진.jpg" class="entry-image" alt="입장하기" onclick="openQuiz()">
        </div>
    </div>

    <!-- O/X 퀴즈 팝업 창 -->
    <div id="quiz-modal" class="quiz-modal">
        <div id="question-text" class="quiz-question">질문이 여기에 표시됩니다.</div>
        <div class="ox-buttons">
            <button class="ox-btn btn-o" onclick="checkAnswer('O')">O</button>
            <button class="ox-btn btn-x" onclick="checkAnswer('X')">X</button>
        </div>
        <div id="quiz-result"></div>
        <button class="skip-btn" onclick="goToMain()">귀찮으면 그냥 들어와...ㅇㅅㅇ 🚪</button>
    </div>

    <script>
        // O/X 퀴즈 5가지 데이터 (정답은 'O' 또는 'X')
        const quizzes = [
            { q: "안소영이 제일 좋아하는 게임은 철권이다.", answer: "O" },
            { q: "안소영 키 170", answer: "O" },
            { q: "안소영 몸무게 40", answer: "O" },
            { q: "안소영은 치킨 보다 피자를 더 좋아한다.", answer: "X" },
            { q: "안소영은 안경을 낀다.", answer: "O" }
        ];

        let currentQuiz = null;

        // 퀴즈 창 열기 및 랜덤 문제 출제
        function openQuiz() {
            document.getElementById("quiz-modal").style.display = "block";
            loadRandomQuiz();
        }

        // 랜덤 퀴즈 1개 세팅
        function loadRandomQuiz() {
            const randomIndex = Math.floor(Math.random() * quizzes.length);
            currentQuiz = quizzes[randomIndex];
            document.getElementById("question-text").innerText = currentQuiz.q;
            document.getElementById("quiz-result").innerText = "";
        }

        // 정답 판정
        function checkAnswer(userChoice) {
            const resultDiv = document.getElementById("quiz-result");

            if (userChoice === currentQuiz.answer) {
                // 맞췄을 때
                resultDiv.style.color = "#4a7c59";
                resultDiv.innerText = "✨ 반갑다 친구야 ✨";
                setTimeout(function() {
                    window.location.href = "main.html";
                }, 1200);
            } else {
                // 틀렸을 때
                resultDiv.style.color = "#B41C28";
                resultDiv.innerText = "❌ 다시 풀어보삼 😂";
                setTimeout(function() {
                    loadRandomQuiz(); // 다른 문제로 자동 변경
                }, 1200);
            }
        }

        // 걍 들어오기 버튼
        function goToMain() {
            window.location.href = "main.html";
        }
    </script>

</body>
</html>
