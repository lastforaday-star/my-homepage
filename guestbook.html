
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방명록</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Single+Day&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Single Day', sans-serif;
    background-image: url("배경.gif");
    background-repeat: repeat;
    background-attachment: fixed;
    color: #9E2024;
}

.container {
    width: 700px;
    max-width: 90%;
    margin: 40px auto;
    padding: 25px;
    background: #fff;
    border: 3px solid #86BAAE;
    border-radius: 10px;
}

h2 {
    text-align: center;
    color: #B41C28;
}

input, textarea {
    box-sizing: border-box;
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #86BAAE;
    border-radius: 5px;
    font-family: inherit;
    font-size: 17px;
}

textarea {
    height: 100px;
    resize: vertical;
}

button {
    padding: 10px 20px;
    background: #86BAAE;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    font-size: 17px;
}

.entry {
    background: #F3FAF8;
    border: 1px solid #C2E2DD;
    padding: 15px;
    margin-top: 15px;
    border-radius: 7px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.entry-info {
    color: #9CA123;
    font-size: 14px;
    margin-bottom: 8px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #B41C28;
}
</style>
</head>

<body>

<div class="container">

    <h2>♥ 방명록 ♥</h2>
    <p style="text-align:center;">
        끝에 "<ㅇㅇ이가>" 를 꼭 써주세여
    </p>

    <input type="text" id="name" placeholder="이름을 입력하세요" maxlength="20">

    <textarea id="message" placeholder="방명록을 작성해 주세요." maxlength="500"></textarea>

    <div style="text-align:right;">
        <button onclick="writeGuestbook()">등록하기</button>
    </div>

    <h3>📖 쓸 말 없으면 나를 칭찬하라</h3>

    <div id="guestbookList">방명록을 불러오는 중...</div>

    <a href="main.html" class="back">← 미니홈피로 돌아가기</a>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx3zCoO7JbyilCzwjXTng-BrL30x3HkrzSA074RHSNtyYVZcKaHpk4ymZEfN5dXA1TEMg/exec";

async function loadGuestbook() {
    const list = document.getElementById("guestbookList");

    try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error();

        const entries = await response.json();

        list.innerHTML = "";

        if (entries.length === 0) {
            list.textContent = "아직 작성된 방명록이 없어요.";
            return;
        }

        entries.reverse().forEach(entry => {
            const box = document.createElement("div");
            box.className = "entry";

            const info = document.createElement("div");
            info.className = "entry-info";
            info.textContent = entry.name + " · " + entry.date;

            const message = document.createElement("div");
            message.textContent = entry.message;

            box.appendChild(info);
            box.appendChild(message);
            list.appendChild(box);
        });

    } catch (error) {
        list.textContent = "방명록을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.";
    }
}

async function writeGuestbook() {
    const name = document.getElementById("name").value.trim();
    const message = document.getElementById("message").value.trim();

    if (!name || !message) {
        alert("이름과 내용을 모두 입력해 주세요.");
        return;
    }

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({ name, message })
        });

        if (!response.ok) throw new Error();

        document.getElementById("name").value = "";
        document.getElementById("message").value = "";

        alert("방명록이 등록되었습니다!");
        loadGuestbook();

    } catch (error) {
        alert("등록에 실패했어요. 잠시 후 다시 시도해 주세요.");
    }
}

loadGuestbook();
</script>

</body>
</html>
