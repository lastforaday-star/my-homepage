
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방명록</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Single+Day&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Single Day', sans-serif;
    background-image: url("배경.gif");
    background-repeat: repeat;
    background-attachment: fixed;
    color: #9E2024;
}
.container {
    width: 700px;
    max-width: 90%;
    margin: 40px auto;
    padding: 25px;
    background: #fff;
    border: 3px solid #86BAAE;
    border-radius: 10px;
}
h2 {
    text-align: center;
    color: #B41C28;
}
input, textarea {
    box-sizing: border-box;
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #86BAAE;
    border-radius: 5px;
    font-family: inherit;
    font-size: 17px;
}
textarea {
    height: 100px;
    resize: vertical;
}
button {
    padding: 10px 20px;
    background: #86BAAE;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    font-size: 17px;
}
.entry {
    background: #F3FAF8;
    border: 1px solid #C2E2DD;
    padding: 15px;
    margin-top: 15px;
    border-radius: 7px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
.entry-info {
    color: #9CA123;
    font-size: 14px;
    margin-bottom: 8px;
}
.back {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #B41C28;
}
</style>
</head>

<body>
<div class="container">

    <h2>♥ 방명록 ♥</h2>
    <p style="text-align:center;">
        끝에 "&lt;ㅇㅇ이가&gt;"를 꼭 써주세여
    </p>

    <input type="text" id="name" placeholder="너 누구야" maxlength="20">
    <textarea id="message" placeholder="수정 삭제 안됨 돌이킬 수 없어" maxlength="500"></textarea>

    <div style="text-align:right;">
        <button id="submitButton" onclick="writeGuestbook()">등록하기</button>
    </div>

    <h3>📖 쓸 말 없으면 나를 칭찬하라</h3>

    <div id="guestbookList">방명록을 불러오는 중...</div>

    <a href="main.html" class="back">← 미니홈피로 돌아가기</a>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx3zCoO7JbyilCzwjXTng-BrL30x3HkrzSA074RHSNtyYVZcKaHpk4ymZEfN5dXA1TEMg/exec";

async function loadGuestbook() {
    const list = document.getElementById("guestbookList");
    list.textContent = "방명록을 불러오는 중...";

    try {
        const response = await fetch(API_URL + "?t=" + Date.now());
        if (!response.ok) throw new Error("서버 응답 오류");

        const entries = await response.json();
        if (!Array.isArray(entries)) throw new Error("데이터 형식 오류");

        list.innerHTML = "";

        const validEntries = entries.filter(
            entry => entry.name && entry.message
        );

        if (validEntries.length === 0) {
            list.textContent = "아직 작성된 방명록이 없어요.";
            return;
        }

       
validEntries.reverse().forEach(entry => {
    const box = document.createElement("div");
    box.className = "entry";

    const info = document.createElement("div");
    info.className = "entry-info";
    info.textContent = entry.name + " · " + entry.date;

    const message = document.createElement("div");

    // URL 자동 인식
    const urlRegex = /https?:\/\/[^\s<>"']+/gi;
    const text = entry.message;
    let lastIndex = 0;
    let match;

    while ((match = urlRegex.exec(text)) !== null) {
        const url = match[0];

        // URL 뒤에 붙은 문장부호 분리
        const cleanUrl = url.replace(/[.,!?;:]+$/, "");
        const trailing = url.slice(cleanUrl.length);

        // URL 앞의 일반 텍스트
        message.appendChild(
            document.createTextNode(text.slice(lastIndex, match.index))
        );

        // 클릭 가능한 링크 생성
        const link = document.createElement("a");
        link.href = cleanUrl;
        link.textContent = cleanUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.style.color = "#B41C28";
        link.style.textDecoration = "underline";

        message.appendChild(link);

        // URL 뒤의 문장부호
        message.appendChild(document.createTextNode(trailing));

        lastIndex = match.index + url.length;
    }

    // 마지막 URL 뒤의 일반 텍스트
    message.appendChild(
        document.createTextNode(text.slice(lastIndex))
    );

    // 방명록 화면에 추가
    box.appendChild(info);
    box.appendChild(message);
    list.appendChild(box);
});

    } catch (error) {
        list.textContent = "방명록을 불러오지 못했어요. 다시 시도해 주세요.";
        console.error("방명록 불러오기 오류:", error);
    }
}

async function writeGuestbook() {
    const name = document.getElementById("name").value.trim();
    const message = document.getElementById("message").value.trim();
    const button = document.getElementById("submitButton");

    if (!name || !message) {
        alert("이름과 내용을 모두 입력해 주세요.");
        return;
    }

    button.disabled = true;

    try {
        await fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({ name, message })
        });

        document.getElementById("name").value = "";
        document.getElementById("message").value = "";

        alert("써줘서 고마워 헤헷ㅋㅋ.");
        await loadGuestbook();

    } catch (error) {
        alert("등록 요청에 실패했어요. 다시 시도해 주세요.");
        console.error(error);
    } finally {
        button.disabled = false;
    }
}

loadGuestbook();
</script>
</body>
</html>
